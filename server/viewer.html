<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soundboard Viewer</title>
<link rel="manifest" href="/viewer.webmanifest">
<!-- iOS non legge display:fullscreen dal manifest: da lì la pagina aggiunta
     alla Home parte senza barre solo con questi due meta. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #stage img, #stage video {
    max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    object-fit: contain;
  }
  #caption {
    position: fixed; left: 0; right: 0; bottom: 0;
    text-align: center;
    padding: 18px 12px;
    color: rgba(255,255,255,0.35);
    font: 14px/1.4 system-ui, sans-serif;
    transition: opacity 1.5s ease;
  }
  #caption.hidden { opacity: 0; }
  #hint {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    padding: 14px 22px;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 10px;
    color: rgba(255,255,255,0.55);
    font: 15px/1.5 system-ui, sans-serif;
    text-align: center;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  #hint.hidden { opacity: 0; }
  /* Lanciata dall'icona in Home il suggerimento non serve: lì non ci sono
     barre da togliere. */
  @media (display-mode: fullscreen), (display-mode: standalone) {
    #hint { display: none; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="caption">In attesa di un visual…</div>
<div id="hint">Tocca lo schermo per andare a tutto schermo</div>
<script>
(function () {
  var stage = document.getElementById('stage')
  var caption = document.getElementById('caption')
  var lastTs = null
  var lastRel = null
  var captionTimer = null

  function showCaption() {
    clearTimeout(captionTimer)
    caption.classList.remove('hidden')
    captionTimer = setTimeout(function () {
      caption.classList.add('hidden')
    }, 3000)
  }

  function showNothing() {
    stage.innerHTML = ''
    showCaption()
  }

  function showMedia(cur) {
    caption.classList.add('hidden')
    clearTimeout(captionTimer)
    var url = '/media/' + cur.rel.split('/').map(encodeURIComponent).join('/')
    var el
    if (cur.contentType && cur.contentType.indexOf('video/') === 0) {
      el = document.createElement('video')
      el.autoplay = true
      el.muted = true
      el.loop = true
      el.playsInline = true
      el.src = url
    } else {
      el = document.createElement('img')
      el.src = url
      el.alt = cur.title || ''
    }
    stage.innerHTML = ''
    stage.appendChild(el)
  }

  // Intervallo base e backoff. Questa pagina sta aperta per tutta la sessione
  // di gioco su un tablet in WiFi: ogni giro costa tempo d'antenna sui 2.4 GHz,
  // la stessa banda che serve alla TV per scaricarsi il media. Quindi:
  // - a schermo spento/scheda in background non si interroga affatto (si
  //   riparte subito al risveglio, così il visual è già lì quando si guarda);
  // - se l'host non risponde si rallenta invece di martellare per ore;
  // - la risposta invariata torna come 304 senza corpo grazie all'ETag.
  var POLL_MS = 1500
  var MAX_POLL_MS = 30000
  var UNCHANGED = {}
  var etag = null
  var delay = POLL_MS
  var timer = null

  function schedule(ms) {
    clearTimeout(timer)
    timer = setTimeout(poll, ms)
  }

  function poll() {
    if (document.hidden) return schedule(POLL_MS) // niente rete a schermo spento
    var headers = etag ? { 'If-None-Match': etag } : undefined
    // no-store: la cache del browser non deve rispondere al posto nostro, la
    // rivalidazione la gestiamo noi con l'ETag qui sopra.
    fetch('/api/cast/current', { headers: headers, cache: 'no-store' })
      .then(function (r) {
        delay = POLL_MS
        // Sentinella e non null: `null` è una risposta legittima del server
        // (nessun visual in corso) e deve svuotare lo schermo.
        if (r.status === 304) return UNCHANGED
        etag = r.headers.get('ETag')
        return r.json()
      })
      .then(function (cur) {
        if (cur === UNCHANGED) return
        if (!cur || !cur.rel) {
          if (lastRel !== null) { lastRel = null; lastTs = null; showNothing() }
          return
        }
        if (cur.ts === lastTs && cur.rel === lastRel) return
        lastTs = cur.ts
        lastRel = cur.rel
        showMedia(cur)
      })
      .catch(function () {
        // Host sparito (PC chiuso, WiFi caduto): rallenta fino a 30s.
        delay = Math.min(delay * 2, MAX_POLL_MS)
      })
      .then(function () { schedule(delay) })
  }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { delay = POLL_MS; schedule(0) }
  })

  // ---- Tutto schermo ----
  // A tutto schermo da solo, al caricamento, NON si può: requestFullscreen()
  // pretende un gesto dell'utente e senza viene rifiutata da ogni browser.
  // Quindi due strade, in ordine di comodità:
  //  1. la pagina aggiunta alla schermata Home parte già senza barre, per via
  //     del manifest (display:fullscreen) e dei meta apple qui sopra: è
  //     l'unica cosa che si comporta davvero come "automatica";
  //  2. chi apre il link e basta tocca una volta lo schermo.
  var hint = document.getElementById('hint')

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement)
  }
  // Lanciata dall'icona: niente barre da togliere, il suggerimento sparisce.
  function launchedStandalone() {
    return (
      (window.matchMedia && (
        window.matchMedia('(display-mode: fullscreen)').matches ||
        window.matchMedia('(display-mode: standalone)').matches
      )) || window.navigator.standalone === true
    )
  }

  function goFullscreen() {
    if (isFullscreen()) return
    var el = document.documentElement
    var req = el.requestFullscreen || el.webkitRequestFullscreen
    if (!req) return // iOS in Safari non lo espone: resta la via della Home
    try {
      var r = req.call(el, { navigationUI: 'hide' })
      if (r && r.catch) r.catch(function () {})
    } catch (e) { /* rifiutata: la pagina resta usabile lo stesso */ }
  }

  function hideHint() {
    if (!hint) return
    hint.classList.add('hidden')
  }

  if (launchedStandalone()) hideHint()

  // Un tocco qualsiasi vale come gesto. pointerup e non click: sul tablet
  // arriva prima e non aspetta il doppio-tap.
  document.addEventListener('pointerup', function () {
    goFullscreen()
    hideHint()
    requestWakeLock()
  })

  // ---- Schermo sempre acceso ----
  // Un tablet che mostra i visual per una sessione intera si spegne da solo
  // dopo un minuto: il visual c'è, il polling gira, ma lo schermo è nero e
  // sembra che il viewer si sia piantato. Il blocco cade da solo quando la
  // scheda va in background, quindi va richiesto di nuovo al risveglio.
  var wakeLock = null
  function requestWakeLock() {
    if (!navigator.wakeLock || wakeLock) return
    navigator.wakeLock.request('screen').then(function (l) {
      wakeLock = l
      l.addEventListener('release', function () { wakeLock = null })
    }).catch(function () { /* negato o non supportato: pazienza */ })
  }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) requestWakeLock()
  })
  requestWakeLock()

  showCaption()
  poll()
})()
</script>
</body>
</html>
